    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" crashes
      // by redefining window.fetch with both a getter and a setter.
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Fetch override error:", e);
        }
      })();
    </script>
